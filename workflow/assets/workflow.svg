<svg xmlns="http://www.w3.org/2000/svg" width="960" height="716" viewBox="0 0 960 716" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13">
  <title>From a GitHub issue to a release: what the maintainer does, what the pipeline does, what lands on GitHub</title>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#6e7781"/>
    </marker>
    <style>
      .lane { fill: #6e7781; font-size: 12px; font-weight: 600; letter-spacing: .08em; }
      .box  { stroke-width: 1.5; rx: 8; }
      .you  { fill: #fff8c5; stroke: #d4a72c; }
      .pipe { fill: #ddf4ff; stroke: #54aeff; }
      .gh   { fill: #dafbe1; stroke: #4ac26b; }
      .t    { fill: #1f2328; }
      .b    { fill: #1f2328; font-weight: 600; }
      .s    { fill: #57606a; font-size: 12px; }
      .code { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: 11.5px; fill: #1f2328; }
      .flow { stroke: #6e7781; stroke-width: 1.5; fill: none; marker-end: url(#arrow); }
      .loop { stroke: #d4a72c; stroke-width: 1.5; fill: none; stroke-dasharray: 5 4; marker-end: url(#arrow); }
      .rule { stroke: #d0d7de; stroke-width: 1; stroke-dasharray: 2 4; }
    </style>
  </defs>

  <!-- lane headers -->
  <text x="155" y="28" class="lane" text-anchor="middle">YOU, THE MAINTAINER</text>
  <text x="480" y="28" class="lane" text-anchor="middle">PIPELINE</text>
  <text x="810" y="28" class="lane" text-anchor="middle">GITHUB</text>
  <line x1="310" y1="40" x2="310" y2="690" class="rule"/>
  <line x1="660" y1="40" x2="660" y2="690" class="rule"/>

  <!-- 1 · open an issue -->
  <rect x="20" y="56" width="270" height="104" class="box you"/>
  <text x="32" y="76" class="b">1  Someone opens an issue: you or a user</text>
  <text x="32" y="94" class="s">a bug: what happened and how to see it</text>
  <text x="32" y="110" class="s">a feature: the problem it should solve</text>
  <text x="32" y="126" class="s">a feature of your own: add the approval</text>
  <text x="32" y="142" class="s">label when filing, and step 3 is skipped</text>

  <rect x="690" y="56" width="240" height="52" class="box gh"/>
  <text x="810" y="78" class="b" text-anchor="middle">Issue #N</text>
  <text x="810" y="96" class="s" text-anchor="middle">the whole spec, treated as evidence</text>
  <path d="M 290 82 L 690 82" class="flow"/>

  <!-- 2 · run -->
  <rect x="20" y="176" width="270" height="88" class="box you"/>
  <text x="32" y="196" class="b">2  Run it, whenever suits you</text>
  <text x="32" y="214" class="code">/pipeline</text><text x="180" y="214" class="s">everything open</text>
  <text x="32" y="230" class="code">/pipeline 12</text><text x="180" y="230" class="s">one issue</text>
  <text x="32" y="246" class="code">/pipeline 12 release</text><text x="180" y="246" class="s">then ship it</text>
  <path d="M 290 214 L 330 214" class="flow"/>

  <!-- PIPELINE steps -->
  <rect x="330" y="176" width="300" height="52" class="box pipe"/>
  <text x="342" y="196" class="b">0  Project profile</text>
  <text x="342" y="214" class="s">gate, merge strategy, changelog, release path</text>

  <path d="M 480 228 L 480 246" class="flow"/>
  <rect x="330" y="246" width="300" height="52" class="box pipe"/>
  <text x="342" y="266" class="b">1  Open pull requests</text>
  <text x="342" y="284" class="s">pr-audit · dependency-bump for bot bumps</text>

  <path d="M 480 298 L 480 316" class="flow"/>
  <rect x="330" y="316" width="300" height="52" class="box pipe"/>
  <text x="342" y="336" class="b">2  Issues</text>
  <text x="342" y="354" class="s">issue-audit: reproduce, root cause, fix plan</text>

  <path d="M 480 368 L 480 386" class="flow"/>
  <rect x="330" y="386" width="300" height="66" class="box pipe"/>
  <text x="342" y="406" class="b">3  Approval policy</text>
  <text x="342" y="424" class="s">bug or docs fix  →  approved, continue</text>
  <text x="342" y="440" class="s">new functionality  →  proposal comment, wait</text>

  <!-- 3 · decide -->
  <path d="M 330 436 L 290 436" class="loop"/>
  <rect x="20" y="386" width="295" height="104" class="box you"/>
  <text x="32" y="406" class="b">3  Decide, for features only</text>
  <text x="32" y="424" class="s">the issue now carries the decision label</text>
  <text x="32" y="440" class="s">and a comment with the plan: change, tests,</text>
  <text x="32" y="456" class="s">docs, size. Answer with one of:</text>
  <text x="32" y="474" class="s">approval label OR a reply that amends OR wontfix</text>
  <path d="M 155 490 L 155 548 L 330 548" class="loop"/>

  <path d="M 480 452 L 480 522" class="flow"/>
  <rect x="330" y="522" width="300" height="52" class="box pipe"/>
  <text x="342" y="542" class="b">4  Resolve, one ticket at a time</text>
  <text x="342" y="560" class="s">branch → test first → PR → green CI → merge</text>

  <path d="M 630 548 L 690 548" class="flow"/>
  <rect x="690" y="522" width="240" height="52" class="box gh"/>
  <text x="810" y="542" class="b" text-anchor="middle">PR merged, issue closed</text>
  <text x="810" y="560" class="s" text-anchor="middle">Closes #N · green CI on that SHA</text>

  <path d="M 480 574 L 480 592" class="flow"/>
  <rect x="330" y="592" width="300" height="52" class="box pipe"/>
  <text x="342" y="612" class="b">5  Post-audit, then release</text>
  <text x="342" y="630" class="s">release only with the word "release"</text>

  <path d="M 630 618 L 690 618" class="flow"/>
  <rect x="690" y="592" width="240" height="52" class="box gh"/>
  <text x="810" y="612" class="b" text-anchor="middle">Tag + GitHub release</text>
  <text x="810" y="630" class="s" text-anchor="middle">version from the changelog</text>

  <!-- 4 · read the report -->
  <path d="M 330 618 L 290 618" class="flow"/>
  <rect x="20" y="592" width="270" height="88" class="box you"/>
  <text x="32" y="612" class="b">4  Read the report</text>
  <text x="32" y="630" class="s">what landed: PRs, issues, release</text>
  <text x="32" y="646" class="s">"left for the maintainer": decisions, PRs</text>
  <text x="32" y="662" class="s">awaiting review, declines to close or reopen</text>

  <text x="480" y="706" class="s" text-anchor="middle">Solid arrows run without you. Dashed arrows are the one place a feature waits for your answer.</text>
</svg>
